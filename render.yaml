services:
  # FastAPI Backend Web Service
  - type: web
    name: gcet-backend
    runtime: docker
    plan: starter
    disk:
      name: chroma-storage
      mountPath: /app/chroma_db
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gcet-postgres-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

databases:
  # Managed PostgreSQL Database
  - name: gcet-postgres-db
    databaseName: gcet_student_assistant
    user: gcet_user
    plan: free
